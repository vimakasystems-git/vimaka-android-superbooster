name: Build e Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.9 }
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Crie o secret KEYSTORE_BASE64 (veja README)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleDeveloperRelease bundlePlayRelease \
            -PgithubRepo=${{ github.repository }} \
            -PappVersion=${GITHUB_REF_NAME#v} \
            -PappCode=$((1000 + GITHUB_RUN_NUMBER))
          mv app/build/outputs/apk/developer/release/app-developer-release.apk vimaka-android-superbooster.apk
      - uses: softprops/action-gh-release@v2
        with: { files: vimaka-android-superbooster.apk }

      - uses: actions/upload-artifact@v4
        with:
          name: play-store-aab
          path: app/build/outputs/bundle/playRelease/*.aab
