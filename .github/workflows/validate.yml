name: Validar Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar e verificar as duas edições
        run: gradle assemblePlayDebug assembleDeveloperDebug lintPlayDebug lintDeveloperDebug testPlayDebugUnitTest testDeveloperDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            app/build/outputs/apk/**/debug/*.apk
            app/build/reports/
